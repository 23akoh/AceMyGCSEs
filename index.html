<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceMyGCSEs - Smart Revision Hub</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="Blue White Modern Learning Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght=0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        body { font-family: 'Comic Neue', cursive, sans-serif; }
        :root { --theme-color: #b39ddb; }
        .dynamic-bg { background-color: var(--theme-color) !important; }
        .dynamic-text { color: var(--theme-color) !important; }
        .dynamic-border { border-color: var(--theme-color) !important; }
        .dynamic-accent { accent-color: var(--theme-color) !important; }
        .dynamic-ring:focus { --tw-ring-color: var(--theme-color) !important; }
        
        /* Print Styles */
        @media print {
            body { background: white !important; }
            nav, #onboarding-section, #subject-focus-banner, .sidebar, .tab-btn, #btn-reset, #btn-print { display: none !important; }
            #dashboard-section { display: block !important; }
            .tab-view { display: none !important; }
            #view-timetable { display: block !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
            .print-grid { border-collapse: collapse; width: 100%; }
            .print-grid th, .print-grid td { border: 1px solid #ddd; padding: 8px; text-align: left; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen">

    <nav class="bg-white shadow-sm p-4 flex justify-between items-center border-b-2 dynamic-border">
        <div class="flex items-center space-x-3">
            <img src="Blue White Modern Learning Logo.png" alt="AceMyGCSEs Logo" class="w-10 h-10 object-contain rounded-lg">
            <h1 class="text-2xl font-bold text-black select-none">AceMyGCSEs</h1>
        </div>
        <div id="user-nav-profile" class="hidden flex items-center space-x-4">
            <div class="text-right">
                <span id="nav-username" class="font-bold block text-sm text-gray-900">Student Name</span>
                <span id="nav-year" class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">Year 11</span>
            </div>
            <img id="nav-pfp" src="" class="w-10 h-10 rounded-full object-cover border border-gray-200" alt="Profile">
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 flex flex-col gap-6 lg:flex-row">
        
        <div class="flex-1 space-y-6">
            
            <section id="onboarding-section" class="bg-white p-6 sm:p-8 rounded-xl shadow-md space-y-6">
                <div class="border-b pb-4 text-center">
                    <h2 class="text-3xl font-bold text-gray-900">Configure Your Hub</h2>
                </div>

                <form id="setup-form" class="space-y-6" onsubmit="handleFormSubmit(event)">
                    
                    <div class="bg-purple-50/50 p-5 rounded-xl border border-purple-100 grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                        <div class="md:col-span-1 flex flex-col items-center justify-center border-r border-purple-100 pr-2">
                            <label for="input-pfp" class="cursor-pointer flex flex-col items-center group">
                                <img id="setup-pfp-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b39ddb'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" class="w-16 h-16 rounded-full object-cover border-2 dynamic-border bg-white shadow-sm">
                                <span class="text-[10px] text-purple-600 font-bold mt-2 text-center bg-purple-100 px-2 py-1 rounded">Upload PFP</span>
                            </label>
                            <input type="file" id="input-pfp" accept="image/*" class="hidden" onchange="processPFP(event)">
                        </div>
                        <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div><label class="block text-sm font-medium">First Name</label><input type="text" id="input-fname" required class="mt-1 w-full p-2 border rounded-md bg-white"></div>
                            <div><label class="block text-sm font-medium">Surname</label><input type="text" id="input-sname" required class="mt-1 w-full p-2 border rounded-md bg-white"></div>
                            <div><label class="block text-sm font-medium">School Year</label>
                                <select id="input-year" class="mt-1 w-full p-2 border rounded-md bg-white">
                                    <option value="7">Year 7</option><option value="8">Year 8</option><option value="9">Year 9</option>
                                    <option value="10">Year 10</option><option value="11" selected>Year 11</option><option value="12">Year 12</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 space-y-3">
                            <h3 class="font-bold text-sm text-blue-900">School & Sleep Hours</h3>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div><label>School Starts</label><input type="time" id="school-start" value="08:45" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>School Ends</label><input type="time" id="school-end" value="15:30" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>Bedtime</label><input type="time" id="sleep-bed" value="22:00" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>Wake-up</label><input type="time" id="sleep-wake" value="07:00" class="w-full p-1.5 border rounded-md bg-white"></div>
                            </div>
                        </div>
                        <div class="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 space-y-3">
                            <h3 class="font-bold text-sm text-emerald-900">Revision Slots</h3>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div><label>Slot Mins</label><input type="number" id="slot-length" value="45" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>Break Mins</label><input type="number" id="break-length" value="10" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>Weekday Count</label><input type="number" id="slots-weekday" value="3" class="w-full p-1.5 border rounded-md bg-white"></div>
                                <div><label>Weekend Count</label><input type="number" id="slots-weekend" value="5" class="w-full p-1.5 border rounded-md bg-white"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-rose-50/50 p-4 rounded-xl border border-rose-100 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-sm text-rose-900">Extra-Curricular Clubs (Specific Days)</h3>
                            <button type="button" onclick="appendClubRowToSetup('', 'Monday', '1
