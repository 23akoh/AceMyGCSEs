    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body { font-family: 'Comic Neue', cursive, sans-serif; }
        :root { --theme-color: #b39ddb; }
        .dynamic-bg { background-color: var(--theme-color) !important; }
        .dynamic-text { color: var(--theme-color) !important; }
        .dynamic-border { border-color: var(--theme-color) !important; }
        .dynamic-accent { accent-color: var(--theme-color) !important; }
        .dynamic-ring:focus { --tw-ring-color: var(--theme-color) !important; }
        
        /* Print Styles */
        @media print {
            body { background: white !important; }
            nav, #onboarding-section, #subject-focus-banner, .sidebar, .tab-btn, #btn-reset, #btn-print { display: none !important; }
            #dashboard-section { display: block !important; }
            .tab-view { display: none !important; }
            #view-timetable { display: block !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
            .print-grid { border-collapse: collapse; width: 100%; }
            .print-grid th, .print-grid td { border: 1px solid #ddd; padding: 8px; text-align: left; }
            .no-print { display: none !important; }
        }
    </style>
</head>
