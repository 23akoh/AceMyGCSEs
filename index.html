<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
        }
        :root { --theme-color: #b39ddb; }
        .dynamic-bg { background-color: var(--theme-color) !important; }
        .dynamic-text { color: var(--theme-color) !important; }
        .dynamic-border { border-color: var(--theme-color) !important; }
        .dynamic-accent { accent-color: var(--theme-color) !important; }
        .dynamic-ring:focus { --tw-ring-color: var(--theme-color) !important; }
        input[type="checkbox"].topic-check {
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
    </style>
</head>
